#[build-system]
#requires = ["uv_build>=0.13.5,<0.14.0"]
#build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "jupyterlab-execute-time>=3.3.0",
    "notebook>=7.6.3",
]
